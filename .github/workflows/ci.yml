# Formatting, lints and the tests that run without fetched data. The
# comparisons with xsltproc on the conformance suite, DocBook and the real
# stylesheets need fetched data and Docker; they skip themselves here (see
# README.md, "Testing").
name: CI

on:
  push:
  pull_request:
  # Run by hand from the Actions page; this is the only run that also tests
  # on macOS (see the matrix below).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS only in runs started by hand: GitHub's macOS runners are
        # sometimes unavailable for hours, and a job that never gets a runner
        # fails the run even with continue-on-error.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # A macOS-only test failure shouldn't mark the whole run as failed.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  msrv:
    name: Build with the minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - name: Build
        run: cargo build --all-targets

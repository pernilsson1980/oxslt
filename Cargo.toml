[package]
name = "oxslt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A memory-safe, drop-in replacement for the xsltproc command (XSLT 1.0)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pernilsson1980/oxslt"
readme = "README.md"
keywords = ["xslt", "xsltproc", "xml", "xpath", "docbook"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
encoding_rs = "0.8.44"
quick-xml = "0.42.0"

[profile.release]
lto = "fat"
codegen-units = 1
